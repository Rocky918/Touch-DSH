name: Bug report
description: Report a reproducible Touch DSH problem
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, prompts, usernames, and private paths from logs and screenshots.
          required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Touch DSH (Touch Bar)
        - Touch DSH Menu
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model and chip
      placeholder: MacBook Pro 13-inch 2020, Apple M1
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: macOS and DSH versions
      placeholder: macOS 15.x; dsh 0.1.1-rc.2
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Attach only the smallest relevant excerpt. Never upload complete unsanitized logs.
